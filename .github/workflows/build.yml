name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project EyeApp.xcodeproj \
            -scheme EyeApp \
            -configuration Release \
            -destination 'platform=macOS' \
            clean build

      - name: Archive
        run: |
          mkdir -p build/archive
          xcodebuild -project EyeApp.xcodeproj \
            -scheme EyeApp \
            -configuration Release \
            -archivePath build/archive/EyeApp.xcarchive \
            archive

      - name: Export App
        run: |
          # Copy the app from archive (no code signing needed for local use)
          mkdir -p build/export
          cp -R build/archive/EyeApp.xcarchive/Products/Applications/EyeApp.app build/export/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeApp-macOS
          path: build/export/EyeApp.app
          retention-days: 30
