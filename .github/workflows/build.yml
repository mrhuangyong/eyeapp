name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/xcbuildtool@v1
        with:
          xcode-version: '16.2'
          include-beta: false

      - name: Build
        run: |
          xcodebuild -project EyeApp.xcodeproj \
            -scheme EyeApp \
            -configuration Release \
            -destination 'platform=macOS' \
            clean build

      - name: Archive
        run: |
          mkdir -p build
          ditto EyeApp.app build/EyeApp.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeApp-macOS
          path: build/EyeApp.app
          retention-days: 30
